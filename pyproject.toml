[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-assistant"
version = "0.1.0"
description = "Offline-first, permission-gated Windows desktop voice assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "platformdirs>=4.2,<5",
  "jsonschema>=4.23,<5",
  "cryptography>=43,<46",
  "PyYAML>=6,<7",
  "tzdata>=2025.2,<2028",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "qasync>=0.27,<1", "keyboard>=0.13,<1"]
audio = ["sounddevice>=0.5,<1", "numpy>=2.1,<3", "send2trash>=1.8,<2"]
stt = ["faster-whisper>=1.1,<2"]
wakeword = ["openwakeword>=0.6,<1", "onnxruntime>=1.20,<2"]
integrations = ["paho-mqtt>=2.1,<3"]
browser = ["playwright>=1.49,<2"]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]
dev = ["ruff>=0.12,<1"]
ui-test = ["PySide6>=6.8,<7", "pytest-qt>=4.4,<5"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
local-assistant = "assistant.app:main"
assistant-skill = "assistant.skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["ui: tests that require PySide6 and pytest-qt"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "auto"
